<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Moved to ariashaw.com | Aria Shaw's Digital Garden</title>

    <!-- Critical SEO: Canonical URL pointing to new domain -->
    <link rel="canonical" href="https://ariashaw.com/">

    <!-- Meta refresh - Google recognizes this as a permanent redirect -->
    <meta http-equiv="refresh" content="0; url=https://ariashaw.com/">

    <!-- Tell search engines this is a permanent move -->
    <meta name="robots" content="noindex, follow">

    <!-- Open Graph for social sharing -->
    <meta property="og:url" content="https://ariashaw.com/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Aria Shaw's Digital Garden - Now at ariashaw.com">
    <meta property="og:description" content="We've moved to our new domain ariashaw.com">

    <!-- JavaScript redirect for instant user experience -->
    <script>
        // Immediate redirect preserving any path/query/hash
        window.location.replace("https://ariashaw.com/");
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        a {
            color: #fff;
            font-weight: 600;
            text-decoration: underline;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.8;
        }

        .spinner {
            margin: 30px auto 20px;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .note {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚀</div>
        <h1>We've Moved!</h1>
        <p>This site has permanently relocated to</p>
        <p><a href="https://ariashaw.com">ariashaw.com</a></p>

        <div class="spinner"></div>
        <p>Redirecting you automatically...</p>

        <p class="note">
            If you're not redirected within 5 seconds,<br>
            <a href="https://ariashaw.com">click here to visit the new site</a>
        </p>
    </div>
</body>
</html>
