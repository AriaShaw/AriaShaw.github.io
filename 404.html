<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Moved to ariashaw.com</title>

    <!-- Tell search engines not to index this 404 page -->
    <meta name="robots" content="noindex, follow">

    <!-- JavaScript redirect that preserves the full URL path -->
    <script>
        (function() {
            // Get the current path, search params, and hash
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;

            // Construct the new URL on ariashaw.com
            var newUrl = "https://ariashaw.com" + path + search + hash;

            // Log for debugging (remove in production if needed)
            console.log("Redirecting from:", window.location.href);
            console.log("Redirecting to:", newUrl);

            // Perform immediate redirect
            window.location.replace(newUrl);
        })();
    </script>

    <!-- Fallback meta refresh (in case JavaScript is disabled) -->
    <meta http-equiv="refresh" content="0; url=https://ariashaw.com/">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .url-display {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 16px;
            border-radius: 8px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 14px;
            word-break: break-all;
        }

        a {
            color: #fff;
            font-weight: 600;
            text-decoration: underline;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.8;
        }

        .spinner {
            margin: 30px auto 20px;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .note {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔄</div>
        <h1>This Page Has Moved!</h1>
        <p>We've permanently relocated to <strong>ariashaw.com</strong></p>

        <div class="url-display">
            <span id="redirect-url">Calculating new URL...</span>
        </div>

        <div class="spinner"></div>
        <p>Redirecting automatically...</p>

        <p class="note">
            If you're not redirected within 5 seconds,<br>
            <a href="https://ariashaw.com" id="manual-link">click here to continue</a>
        </p>
    </div>

    <script>
        // Update the displayed redirect URL
        (function() {
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;
            var newUrl = "https://ariashaw.com" + path + search + hash;

            document.getElementById('redirect-url').textContent = newUrl;
            document.getElementById('manual-link').href = newUrl;
        })();
    </script>
</body>
</html>
